services:
  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: skillmatch-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend
    networks:
      - skillmatch-net

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: skillmatch-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    environment:
      - PORT=5000
      - MONGO_URI=${MONGO_URI:-mongodb://mongo:27017/skillmatch}
      - JWT_SECRET=${JWT_SECRET:-super_secret_jwt_key_skillmatch_2026}
      - GOOGLE_GENAI_API_KEY=${GOOGLE_GENAI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
      - CLIENT_URL=${CLIENT_URL:-http://localhost}
      - PUPPETEER_EXECUTABLE_PATH=/usr/bin/chromium
    depends_on:
      mongo:
        condition: service_started
    networks:
      - skillmatch-net

  mongo:
    image: mongo:7.0
    container_name: skillmatch-mongo
    restart: unless-stopped
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - skillmatch-net

volumes:
  mongo_data:
    driver: local

networks:
  skillmatch-net:
    driver: bridge
